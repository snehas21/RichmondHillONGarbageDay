<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Richmond Hill Garbage Day Checker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green:  #2d6a2d;
      --green-light: #e8f5e9;
      --green-border: #a5d6a7;
      --blue:   #1565c0;
      --blue-light: #e3f2fd;
      --black:  #1a1a1a;
      --gray-bg: #f5f7fa;
      --card-bg: #ffffff;
      --text:   #1a202c;
      --muted:  #718096;
      --border: #e2e8f0;
      --shadow: 0 2px 12px rgba(0,0,0,0.08);
      --radius: 16px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: var(--gray-bg);
      min-height: 100vh;
      color: var(--text);
      padding: 24px 16px 40px;
    }

    .app {
      max-width: 460px;
      margin: 0 auto;
    }

    /* ── HEADER ── */
    .header {
      text-align: center;
      margin-bottom: 24px;
      padding-top: 8px;
    }

    .header-icon {
      font-size: 2.8rem;
      display: block;
      margin-bottom: 8px;
      line-height: 1;
    }

    .header h1 {
      font-size: 1.55rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .header .city {
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 4px;
    }

    /* ── CARD ── */
    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px;
      margin-bottom: 14px;
    }

    /* ── DATE CARD ── */
    .date-card {
      text-align: center;
      padding: 18px 20px;
    }

    .date-card .weekday {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
    }

    .date-card .full-date {
      font-size: 1.45rem;
      font-weight: 800;
      color: var(--text);
      margin-top: 2px;
    }

    /* ── SEARCH CARD ── */
    .search-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .input-row {
      display: flex;
      gap: 8px;
    }

    .street-input {
      flex: 1;
      padding: 11px 14px;
      border: 2px solid var(--border);
      border-radius: 10px;
      font-size: 1rem;
      color: var(--text);
      background: var(--card-bg);
      outline: none;
      transition: border-color 0.18s;
    }

    .street-input:focus {
      border-color: var(--green);
    }

    .check-btn {
      padding: 11px 20px;
      background: var(--green);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.18s, transform 0.1s;
      white-space: nowrap;
    }

    .check-btn:hover  { background: #1e4d1e; }
    .check-btn:active { transform: scale(0.97); }

    /* ── RESULT: COLLECTION DAY ── */
    .result-yes {
      border: 2px solid var(--green-border);
      background: var(--green-light);
    }

    .result-no {
      border: 2px solid var(--border);
    }

    .result-unknown {
      text-align: center;
      border: 2px dashed var(--border);
    }

    .result-status-row {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 18px;
    }

    .result-icon {
      font-size: 2.2rem;
      line-height: 1;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .result-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 2px;
    }

    .result-label.green { color: #276749; }
    .result-label.gray  { color: var(--muted); }

    .result-street {
      font-size: 1.15rem;
      font-weight: 800;
    }

    /* ── COLLECTION BADGE ── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 50px;
      font-size: 0.88rem;
      font-weight: 700;
    }

    .badge-black-bag {
      background: var(--black);
      color: #fff;
    }

    .badge-green-only {
      background: #e2e8f0;
      color: #4a5568;
    }

    /* ── BINS LIST ── */
    .bins-list {
      border-top: 1px solid rgba(0,0,0,0.07);
      margin-top: 16px;
      padding-top: 14px;
    }

    .bin-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 0;
    }

    .bin-row + .bin-row {
      border-top: 1px solid rgba(0,0,0,0.05);
    }

    .bin-emoji {
      font-size: 1.25rem;
      width: 28px;
      text-align: center;
      flex-shrink: 0;
    }

    .bin-name {
      font-size: 0.92rem;
      font-weight: 600;
      flex: 1;
    }

    .bin-tag {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 50px;
    }

    .tag-yes { background: #c6f6d5; color: #22543d; }
    .tag-no  { background: #fed7d7; color: #9b2c2c; }

    /* ── NEXT DATE BLOCK ── */
    .next-block {
      border-top: 1px solid rgba(0,0,0,0.07);
      margin-top: 16px;
      padding-top: 14px;
      text-align: center;
    }

    .next-block-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .next-block-day {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--text);
    }

    .next-block-date {
      font-size: 0.95rem;
      color: #4a5568;
      margin-top: 2px;
    }

    .next-block-badge {
      margin-top: 10px;
    }

    /* ── NOT COLLECTION DAY ── */
    .next-collection-center {
      text-align: center;
      padding: 8px 0;
    }

    .next-day-big {
      font-size: 1.7rem;
      font-weight: 900;
      color: var(--text);
    }

    .next-date-sub {
      font-size: 1rem;
      color: #4a5568;
      margin-top: 2px;
      margin-bottom: 12px;
    }

    /* ── UNKNOWN STREET ── */
    .unknown-icon { font-size: 2.4rem; margin-bottom: 10px; }

    .unknown-title {
      font-size: 1.05rem;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .unknown-body {
      font-size: 0.88rem;
      color: var(--muted);
      margin-bottom: 18px;
      line-height: 1.6;
    }

    .lookup-btn {
      display: inline-block;
      background: var(--green);
      color: #fff;
      padding: 11px 22px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.9rem;
      transition: background 0.18s;
    }

    .lookup-btn:hover { background: #1e4d1e; }

    /* ── FOOTER ── */
    .footer {
      text-align: center;
      margin-top: 6px;
    }

    .footer a {
      color: var(--muted);
      font-size: 0.82rem;
      text-decoration: none;
    }

    .footer a:hover {
      color: var(--green);
      text-decoration: underline;
    }

    .disclaimer {
      text-align: center;
      font-size: 0.73rem;
      color: #a0aec0;
      margin-top: 18px;
      line-height: 1.65;
    }
  </style>
</head>
<body>
<div class="app">

  <header class="header">
    <span class="header-icon">🗑️</span>
    <h1>Garbage Day Checker</h1>
    <p class="city">Richmond Hill, Ontario</p>
  </header>

  <!-- Date -->
  <div class="card date-card">
    <div class="weekday" id="weekdayDisplay"></div>
    <div class="full-date" id="dateDisplay"></div>
  </div>

  <!-- Street search -->
  <div class="card">
    <div class="search-label">Street</div>
    <div class="input-row">
      <input class="street-input" id="streetInput" type="text"
             value="Winisk St" placeholder="e.g. Winisk St"
             onkeydown="if(event.key==='Enter') checkSchedule()">
      <button class="check-btn" onclick="checkSchedule()">Check</button>
    </div>
  </div>

  <!-- Result -->
  <div id="resultCard"></div>

  <div class="footer">
    <a href="https://eservices.richmondhill.ca/garbagecollection/"
       target="_blank" rel="noopener">
      Verify at the official Richmond Hill lookup tool ↗
    </a>
  </div>

  <p class="disclaimer">
    Green bin &amp; recycling are collected every week.<br>
    Black bag garbage is collected every other week on your zone&nbsp;week.<br>
    Schedule may shift by one day after statutory holidays.
  </p>

</div>

<script>
// ── STREET DATA ──────────────────────────────────────────────────────────────
// day:  JS weekday (0 = Sun … 4 = Thu … 6 = Sat)
// zone: 'blue' or 'yellow'  (which bi-weekly garbage week this street is on)
//
// Richmond Hill uses a Blue / Yellow zone system.
// Both zones share the same collection weekday for a given street but
// alternate which week garbage (black bags) goes out.
//
// Source: City of Richmond Hill Waste Collection Day Lookup Tool
//   https://eservices.richmondhill.ca/garbagecollection/
const STREETS = {
  'winisk st':     { day: 4, zone: 'yellow', label: 'Winisk St' },
  'winisk street': { day: 4, zone: 'yellow', label: 'Winisk St' },
};

// ── ZONE-WEEK CALCULATION ─────────────────────────────────────────────────────
// Reference anchor: week of Monday, January 5, 2026 = Blue zone garbage week.
// Verified against the 2026 Richmond Hill Waste Management Calendar:
//   - Blue zone double-up week: March 16–20, 2026  (week 10 from ref → even → Blue ✓)
//   - Yellow zone double-up week: March 23–27, 2026 (week 11 from ref → odd → Yellow ✓)
const BLUE_REF = new Date(2026, 0, 5); // January 5, 2026

function mondayOfWeek(date) {
  const d = new Date(date);
  d.setHours(0, 0, 0, 0);
  const dow = d.getDay(); // 0=Sun
  d.setDate(d.getDate() - (dow === 0 ? 6 : dow - 1));
  return d;
}

function zoneWeekFor(date) {
  const weekStart = mondayOfWeek(date);
  const refStart  = mondayOfWeek(BLUE_REF);
  const weeksDiff = Math.round((weekStart - refStart) / (7 * 864e5));
  return ((weeksDiff % 2) + 2) % 2 === 0 ? 'blue' : 'yellow';
}

// ── DATE HELPERS ──────────────────────────────────────────────────────────────
const WEEKDAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHS   = ['January','February','March','April','May','June',
                  'July','August','September','October','November','December'];

function formatDate(d) {
  const n = d.getDate();
  const sfx = n % 10 === 1 && n !== 11 ? 'st'
             : n % 10 === 2 && n !== 12 ? 'nd'
             : n % 10 === 3 && n !== 13 ? 'rd' : 'th';
  return `${MONTHS[d.getMonth()]} ${n}${sfx}, ${d.getFullYear()}`;
}

// Next occurrence of weekday `dow` strictly after `from`
function nextWeekday(from, dow) {
  const d = new Date(from);
  d.setHours(0, 0, 0, 0);
  let ahead = (dow - d.getDay() + 7) % 7;
  if (ahead === 0) ahead = 7;
  d.setDate(d.getDate() + ahead);
  return d;
}

// Next collection day on the street's zone week (garbage day)
function nextGarbageDay(from, dow, zone) {
  let d = nextWeekday(from, dow);
  while (zoneWeekFor(d) !== zone) d.setDate(d.getDate() + 7);
  return d;
}

// ── RENDERING ─────────────────────────────────────────────────────────────────
function h(str) {
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function checkSchedule() {
  const raw    = document.getElementById('streetInput').value.trim();
  const key    = raw.toLowerCase();
  const today  = new Date();
  today.setHours(0, 0, 0, 0);

  const street = STREETS[key];
  const out    = document.getElementById('resultCard');

  if (!street) {
    out.innerHTML = `
      <div class="card result-unknown">
        <div class="unknown-icon">🔍</div>
        <div class="unknown-title">Street not in database</div>
        <div class="unknown-body">
          We don't have zone data for <strong>${h(raw)}</strong> yet.<br>
          Use the official City lookup tool to find your collection day and zone.
        </div>
        <a class="lookup-btn"
           href="https://eservices.richmondhill.ca/garbagecollection/"
           target="_blank" rel="noopener">
          Look up your street ↗
        </a>
      </div>`;
    return;
  }

  const isCollDay  = today.getDay() === street.day;
  const todayZone  = zoneWeekFor(today);
  const isGarbDay  = isCollDay && todayZone === street.zone;

  if (isCollDay) {
    // Next garbage day if today is not one
    const nextGarb = isGarbDay ? null : nextGarbageDay(today, street.day, street.zone);

    out.innerHTML = `
      <div class="card result-yes">
        <div class="result-status-row">
          <span class="result-icon">✅</span>
          <div>
            <div class="result-label green">Collection day!</div>
            <div class="result-street">${h(street.label)}</div>
          </div>
        </div>

        <div>
          ${isGarbDay
            ? `<span class="badge badge-black-bag">🗑️ Black Bag Garbage Day</span>`
            : `<span class="badge badge-green-only">♻️ Green Bin &amp; Recycling only — no black bags</span>`
          }
        </div>

        <div class="bins-list">
          <div class="bin-row">
            <span class="bin-emoji">🟢</span>
            <span class="bin-name">Green Bin (organics)</span>
            <span class="bin-tag tag-yes">Out today</span>
          </div>
          <div class="bin-row">
            <span class="bin-emoji">🔵</span>
            <span class="bin-name">Blue Box (recycling)</span>
            <span class="bin-tag tag-yes">Out today</span>
          </div>
          <div class="bin-row">
            <span class="bin-emoji">🖤</span>
            <span class="bin-name">Black Bag Garbage</span>
            <span class="bin-tag ${isGarbDay ? 'tag-yes' : 'tag-no'}">${isGarbDay ? 'Out today' : 'Not this week'}</span>
          </div>
        </div>

        ${!isGarbDay ? `
          <div class="next-block">
            <div class="next-block-label">Next black bag garbage day</div>
            <div class="next-block-day">${WEEKDAYS[nextGarb.getDay()]}</div>
            <div class="next-block-date">${formatDate(nextGarb)}</div>
          </div>
        ` : ''}
      </div>`;

  } else {
    const nextColl   = nextWeekday(today, street.day);
    const nextIsGarb = zoneWeekFor(nextColl) === street.zone;
    const nextGarb   = nextGarbageDay(today, street.day, street.zone);

    out.innerHTML = `
      <div class="card result-no">
        <div class="result-status-row">
          <span class="result-icon">📅</span>
          <div>
            <div class="result-label gray">Not a collection day today</div>
            <div class="result-street">${h(street.label)}</div>
          </div>
        </div>

        <div class="next-collection-center">
          <div class="next-block-label">Next collection day</div>
          <div class="next-day-big">${WEEKDAYS[nextColl.getDay()]}</div>
          <div class="next-date-sub">${formatDate(nextColl)}</div>
          ${nextIsGarb
            ? `<span class="badge badge-black-bag" style="font-size:.82rem;padding:6px 14px;">🗑️ Black bags go out too</span>`
            : `<span class="badge badge-green-only" style="font-size:.82rem;padding:6px 14px;">♻️ Green Bin &amp; Recycling only</span>`
          }
        </div>

        ${!nextIsGarb ? `
          <div class="next-block">
            <div class="next-block-label">Next black bag garbage day</div>
            <div class="next-block-day">${WEEKDAYS[nextGarb.getDay()]}</div>
            <div class="next-block-date">${formatDate(nextGarb)}</div>
          </div>
        ` : ''}
      </div>`;
  }
}

// ── INIT ──────────────────────────────────────────────────────────────────────
function initDateDisplay() {
  const now = new Date();
  document.getElementById('weekdayDisplay').textContent = WEEKDAYS[now.getDay()];
  document.getElementById('dateDisplay').textContent    = formatDate(now);
}

initDateDisplay();
checkSchedule();
</script>
</body>
</html>
